<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>警大學生模擬器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: 左側學生證（數值、獎懲），右側為「公文」樣式的事件卡；頂部六階段進度。 */
:root {
  --paper: #EEF1F5;
  --card: #FFFFFF;
  --ink: #14213D;
  --muted: #5A6579;
  --line: #CBD3DE;
  --navy: #1B3A6B;
  --on-navy: #FFFFFF;
  --tint: #E3E9F2;
  --gold: #A9822A;
  --stamp: #B42318;
  --good: #1F7A4D;
  --f-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1420; --card: #152035; --ink: #E5EAF3; --muted: #94A1B9; --line: #2B3955;
    --navy: #8FB2EA; --on-navy: #0D1420; --tint: #1D2A44; --gold: #D6B25C; --stamp: #F26B5E; --good: #5CC795;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1420; --card: #152035; --ink: #E5EAF3; --muted: #94A1B9; --line: #2B3955;
  --navy: #8FB2EA; --on-navy: #0D1420; --tint: #1D2A44; --gold: #D6B25C; --stamp: #F26B5E; --good: #5CC795;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }

.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 56px; }

/* 頁首 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand svg { width: 38px; height: 38px; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 900; font-size: 20px; letter-spacing: .04em; line-height: 1.2; }
.brand-sub { font-size: 12px; color: var(--muted); letter-spacing: .12em; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
.ghost:hover { border-color: var(--navy); color: var(--ink); }

.timeline { list-style: none; margin: 18px 0 22px; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.timeline li { border-top: 3px solid var(--line); padding-top: 6px; font-size: 13px; color: var(--muted); min-width: 0; }
.timeline li .n { font-family: var(--f-mono); font-size: 11px; display: block; letter-spacing: .05em; }
.timeline li.done { border-color: var(--navy); color: var(--ink); }
.timeline li.now { border-color: var(--gold); color: var(--ink); font-weight: 700; }

.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 840px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* 學生證 */
.idcard { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.id-band { background: var(--navy); color: var(--on-navy); padding: 8px 16px; display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .14em; }
.id-main { padding: 16px; display: grid; gap: 14px; }
.id-head { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: center; }
.avatar { width: 56px; height: 64px; border: 1px solid var(--line); background: var(--tint); display: grid; place-items: center; font-family: var(--f-display); font-weight: 900; font-size: 26px; color: var(--navy); }
.id-name { font-family: var(--f-display); font-weight: 900; font-size: 20px; line-height: 1.3; }
.id-meta { font-size: 12px; color: var(--muted); line-height: 1.6; }
.id-meta .mono { font-family: var(--f-mono); }
.section-label { font-size: 11px; color: var(--muted); letter-spacing: .16em; margin: 0 0 6px; }
.stats { display: grid; gap: 6px; }
.stat { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) 2.2em; align-items: center; gap: 8px; font-size: 13px; }
.stat .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.bar { height: 6px; background: var(--tint); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--navy); transition: width .4s ease; }
.bar > i.low { background: var(--stamp); }
.recs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.rec { border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font-size: 12px; display: flex; justify-content: space-between; }
.rec b { font-family: var(--f-mono); font-weight: 600; }
.rec.bad b { color: var(--stamp); }
.rec.ok b { color: var(--good); }
.meter-note { font-size: 12px; color: var(--muted); margin-top: 6px; }
.meter-note.warn { color: var(--stamp); }
.flags { display: flex; flex-wrap: wrap; gap: 4px; }
.flag { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; color: var(--muted); }

/* 公文事件卡 */
.doc { background: var(--card); border: 1px solid var(--line); border-radius: 3px; padding: 26px clamp(18px, 4vw, 36px) 28px; position: relative; animation: rise .35s ease both; }
@keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
.doc-meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-family: var(--f-mono); font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.doc h2 { font-family: var(--f-display); font-weight: 900; font-size: clamp(22px, 3.2vw, 30px); line-height: 1.35; margin: 18px 0 10px; text-wrap: balance; }
.doc .body { font-size: 16px; line-height: 1.95; max-width: 40em; margin: 0 0 20px; }
.choices { display: grid; gap: 8px; }
.choice { display: grid; grid-template-columns: 2em minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; transition: border-color .15s, background .15s; }
.choice:hover { border-color: var(--navy); background: var(--tint); }
.choice .mk { font-family: var(--f-display); font-weight: 900; color: var(--gold); font-size: 17px; }
.choice .tag { font-size: 11px; font-family: var(--f-mono); color: var(--muted); border: 1px dashed var(--line); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.choice.danger .tag { color: var(--stamp); border-color: var(--stamp); }

.result-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 18px 0 8px; }
.you-chose { font-size: 13px; color: var(--muted); }
.stamp { display: inline-block; border: 2px solid var(--stamp); color: var(--stamp); font-family: var(--f-display); font-weight: 900; padding: 2px 10px; transform: rotate(-4deg); letter-spacing: .12em; font-size: 15px; }
.stamp.ok { border-color: var(--good); color: var(--good); }
.deltas { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 22px; }
.chip { font-size: 13px; border-radius: 4px; padding: 2px 8px; background: var(--tint); font-variant-numeric: tabular-nums; }
.chip.up { color: var(--good); }
.chip.down { color: var(--stamp); }
.chip.rec-bad { background: transparent; border: 1px solid var(--stamp); color: var(--stamp); }
.chip.rec-ok { background: transparent; border: 1px solid var(--good); color: var(--good); }
.report { border-left: 3px solid var(--gold); padding: 4px 0 4px 14px; margin: 0 0 18px; display: grid; gap: 2px; font-size: 15px; }

.btn { background: var(--navy); color: var(--on-navy); border: 0; border-radius: 6px; padding: 10px 22px; font-weight: 700; letter-spacing: .06em; }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.line { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.log { margin-top: 18px; }
.log summary { cursor: pointer; font-size: 13px; color: var(--muted); }
.log ol { margin: 8px 0 0; padding-left: 1.4em; font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
.log li span { color: var(--ink); }

/* 封面 */
.cover { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; align-items: center; padding-block: 24px; }
@media (max-width: 760px) { .cover { grid-template-columns: minmax(0, 1fr); } }
.cover h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(40px, 7vw, 72px); line-height: 1.1; margin: 0 0 14px; letter-spacing: .02em; text-wrap: balance; }
.cover h1 em { font-style: normal; color: var(--gold); }
.cover p.lead { font-size: 17px; max-width: 30em; margin: 0 0 22px; color: var(--muted); }
.route { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-left: 2px solid var(--line); }
.route li { padding: 8px 0 8px 18px; position: relative; }
.route li::before { content: ""; position: absolute; left: -7px; top: 15px; width: 12px; height: 12px; border-radius: 50%; background: var(--card); border: 2px solid var(--navy); }
.route li:last-child::before { background: var(--gold); border-color: var(--gold); }
.route b { font-family: var(--f-display); font-size: 17px; }
.route small { display: block; color: var(--muted); font-size: 13px; }
.unlocked { margin-top: 18px; font-size: 13px; color: var(--muted); }

/* 角色建立 */
.form { display: grid; gap: 22px; }
.field-label { font-family: var(--f-display); font-weight: 900; font-size: 18px; margin: 0 0 8px; }
.field-label small { font-family: var(--f-body); font-weight: 400; font-size: 13px; color: var(--muted); margin-left: 6px; }
.text-in { width: 100%; max-width: 320px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { background: var(--card); border: 0; padding: 7px 20px; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); }
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 8px; }
.opt { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 2px; }
.opt:hover { border-color: var(--navy); }
.opt[aria-pressed="true"] { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); background: var(--tint); }
.opt b { font-size: 15px; }
.opt span { font-size: 12px; color: var(--muted); line-height: 1.5; }
.preview { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; }

/* 結局派令 */
.order { text-align: left; }
.order .big { font-family: var(--f-display); font-weight: 900; font-size: clamp(30px, 5vw, 48px); line-height: 1.2; margin: 14px 0 6px; text-wrap: balance; }
.order .sub { color: var(--muted); margin: 0 0 18px; }
.seal { position: absolute; right: clamp(16px, 4vw, 36px); top: 54px; width: 84px; height: 84px; border: 3px solid var(--stamp); color: var(--stamp); display: grid; grid-template-columns: 1fr 1fr; place-items: center; font-family: var(--f-display); font-weight: 900; font-size: 22px; line-height: 1; transform: rotate(6deg); opacity: .9; padding: 6px; }
.order .big, .order .sub { padding-right: 96px; }
@media (max-width: 520px) { .seal { position: static; margin-top: 12px; } .order .big, .order .sub { padding-right: 0; } }
.order-text { font-size: 16px; line-height: 1.95; max-width: 40em; }
.order-text p { margin: 0 0 10px; }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 8px; margin: 18px 0; }
.summary div { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.summary small { display: block; font-size: 12px; color: var(--muted); }
.summary b { font-family: var(--f-mono); font-size: 18px; font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <path d="M20 2 L35 8 V20 C35 29 28 35 20 38 C12 35 5 29 5 20 V8 Z" fill="var(--navy)"/>
        <path d="M20 10 l2.6 5.4 5.9.8-4.3 4.1 1 5.8L20 23.4l-5.2 2.7 1-5.8-4.3-4.1 5.9-.8Z" fill="var(--gold)"/>
      </svg>
      <div>
        <div class="brand-name">警大學生模擬器</div>

</div>

<script>

    ch: [
      { t: "閉關苦讀，每天十二小時", e: { aca: 8, men: -6, fit: -3 }, r: "考古題做了三輪，但你已經好幾週沒看到太陽。" },
      { t: "和同學在圖書館互相督促", e: { aca: 6, soc: 2, men: -2 }, r: "誰先滑手機誰請宵夜。" },

  x2: { when: "特考・考前一週", where: "家中", title: "偏偏這時候感冒",
    text: "考前一週，你感冒了，晚上還開始失眠。",
    ch: [
      { t: "看醫生、早睡，減少讀書量", e: { men: 5, aca: -1 }, r: "考前兩天，你終於睡了個好覺。" },
      { t: "吃感冒藥繼續拚", e: { aca: 3, men: -5 }, r: "腦袋昏沉，但進度沒落後。" },
      { t: "打電話給最重要的人聊聊", e: { men: 6 }, r: "電話那頭說：「考完我們去吃好料。」" },

    text: "「試論警察職權行使法中，身分查證之要件與界限。」你對這題只有模糊的印象。",
    ch: [
      { t: "冷靜寫出架構，有多少寫多少", chk: { s: "men", dc: 50,
        ok: { bonus: 6, r: "你從法律保留、比例原則一路寫下來，越寫越清楚。" },
        no: { bonus: 1, r: "架構有了，內容卻寫得零零落落。" } } },
      { t: "先寫會的題目，最後回頭補", chk: { s: "aca", dc: 50,
        ok: { bonus: 7, r: "回頭時你突然想起第六條和第七條，順利補完。" },
        no: { bonus: -2, r: "時間到了，第三題只寫了一半。" } } },
      { t: "腦袋一片空白", e: { men: -5 }, bonus: -6, r: "你盯著題目直到鐘聲響起。" },
    ] },
  x4: { when: "特考・放榜日", where: "考選部榜單", title: "放榜",
    text: "早上九點，考選部網站上線。你深吸一口氣，輸入准考證號碼。",
    ch: [ { t: "查看榜單", fn: "exam" } ] },
};

const POOLS = {
  1: ["y1a", "y1b", "y1c", "y1d", "y1e", "y1f", "y1g", "y1h", "y1i"],
  2: ["y2a", "y2b", "y2c", "y2d", "y2e", "y2f", "y2g", "y2h", "y2i"],
  3: ["y3a", "y3b", "y3c", "y3d", "y3e", "y3f", "y3g", "y3h"],
  4: ["y4a", "y4c", "y4d", "y4e", "y4f", "y4g"],
};

/* ---------- 狀態 ---------- */
const SAVE_KEY = "cpu-sim-save-v1";
const ENDINGS_KEY = "cpu-sim-endings-v1";
let S = null;      // 遊戲狀態
let view = "title";
let draft = null;  // 角色建立草稿

function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function fetchStore(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function clearStore(k) { try { localStorage.removeItem(k); } catch (e) {} }
function save() { if (S && !S.ending) store(SAVE_KEY, S); else clearStore(SAVE_KEY); }

const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const dept = () => DEPTS.find((d) => d.id === S.dept);
const netDemerit = (rec) => REC_BAD.reduce((n, k) => n + rec[k] * REC_PTS[k], 0) - REC_GOOD.reduce((n, k) => n + rec[k] * REC_PTS[k], 0);
const chance = (stat, dc) => clamp(50 + (stat - dc) * 2, 10, 95);
const cnNum = (n) => CN_NUM[n] || String(n);

/* ---------- 角色建立 ---------- */
function newDraft() {
  return { name: NAMES[rnd(0, NAMES.length - 1)], gender: "男", dept: "adm", bg: "family", roll: rollDice() };
}
function rollDice() { const r = {}; STAT_KEYS.forEach((k) => (r[k] = rnd(-5, 5))); return r; }
function draftStats(d) {
  const dp = DEPTS.find((x) => x.id === d.dept), bg = BACKGROUNDS.find((x) => x.id === d.bg);
  const s = {};
  STAT_KEYS.forEach((k) => (s[k] = clamp(45 + (dp.b[k] || 0) + (bg.b[k] || 0) + d.roll[k], 5, 95)));
  return s;
}
function startGame() {
  const d = draft;
  const idx = DEPTS.findIndex((x) => x.id === d.dept);
  S = {
    name: d.name.trim() || "無名新生", gender: d.gender, dept: d.dept, bg: d.bg,
    sid: "115" + String(idx + 1).padStart(2, "0") + String(rnd(1, 120)).padStart(3, "0"),
    stats: draftStats(d), rec: { 嘉獎: 0, 小功: 0, 大功: 0, 申誡: 0, 小過: 0, 大過: 0 },
    flags: d.bg === "family" ? { family: true } : {}, club: null,
    stage: 0, queue: [], idx: 0, log: [], strikes: 0, bonus: 0,
    stageStart: null, result: null, ending: null, yearReport: null,
  };
  beginStage(0);
  view = "event";
  save(); render();
}

function beginStage(n) {
  S.stage = n; S.idx = 0; S.stageStart = { ...S.stats };
  let q;
  const draw = (pool, k) => shuffle(POOLS[pool].filter((id) => !EV[id].need || EV[id].need(S))).slice(0, k);
  if (n === 0) q = ["p1", "p2", "p3", "p4", "p5", "p6"];
  else if (n >= 1 && n <= 3) q = [["y1s", "y2s", "y3s"][n - 1], ...draw(n, 4), "yend"];
  else if (n === 4) q = ["y4s", ...(S.flags.bribe ? ["y4b"] : []), ...draw(4, 4), "yend", "grad"];
  else q = ["x1", "x2", "x3", "x4"];
  S.queue = q;
}

/* ---------- 選擇 ---------- */
function currentEvent() {
  const id = S.queue[S.idx];
  if (id === "yend") return yearEndEvent();
  return EV[id];
}

function yearEndEvent() {
  const y = S.stage;
  return { when: STAGES[y] + "・學年末", where: "教務處佈告欄", title: STAGES[y] + "學年考核",
    text: "學年結束。學科成績、體能測驗與操行成績即將公布。及格標準一年比一年嚴格，不及格要補考，補考仍未通過將留下紀錄；累計兩次將被退學。",
    ch: [{ t: "查看成績單", fn: "yearEnd" }] };
}

function choose(i) {
  const ev = currentEvent(), c = ev.ch[i];
  const out = { label: c.t, e: {}, rec: {}, r: c.r || "", roll: null, report: null };
  const merge = (src) => {
    if (!src) return;
    if (src.e) for (const k in src.e) out.e[k] = (out.e[k] || 0) + src.e[k];
    if (src.rec) for (const k in src.rec) out.rec[k] = (out.rec[k] || 0) + src.rec[k];
    if (src.set) src.set.forEach((f) => (S.flags[f] = true));
    if (src.unset) src.unset.forEach((f) => delete S.flags[f]);
    if (src.bonus) S.bonus += src.bonus;
    if (src.r) out.r = src.r;
  };
  if (c.end) { finish(c.end); return; }
  merge(c);
  if (c.club) S.club = c.club;
  if (c.chk) {
    const p = chance(S.stats[c.chk.s], c.chk.dc);
    const ok = Math.random() * 100 < p;
    out.roll = { s: c.chk.s, p, ok };
    merge(ok ? c.chk.ok : c.chk.no);
  }
  if (c.fn === "yearEnd") yearEnd(out);
  if (c.fn === "exam") { exam(); return; }
  apply(out);
  S.log.push({ st: STAGES[S.stage], ev: ev.title, c: c.t });
  S.result = out;
  view = "result";
  save(); render();
}

function apply(out) {
  for (const k in out.e) S.stats[k] = clamp(S.stats[k] + out.e[k], 0, 100);
  for (const k in out.rec) S.rec[k] += out.rec[k];
}

function yearEnd(out) {
  const y = S.stage, lines = [];
  const checks = [
    { k: "aca", name: "學科成績", thr: 30 + y * 5, fix: { aca: 6, men: -4 } },
    { k: "fit", name: "體能測驗", thr: 30 + y * 5, fix: { fit: 6, men: -3 } },
    { k: "mor", name: "操行成績", thr: 25, fix: { mor: 5, men: -2 } },
  ];
  checks.forEach((c) => {
    const v = S.stats[c.k];
    if (v >= c.thr) { lines.push(`${c.name}：${v}（標準 ${c.thr}）及格`); return; }
    const p = clamp(55 + (S.stats.men - 50), 20, 90);
    const pass = Math.random() * 100 < p;
    for (const k in c.fix) out.e[k] = (out.e[k] || 0) + c.fix[k];
    if (pass) lines.push(`${c.name}：${v}（標準 ${c.thr}）不及格，寒假留校補考後通過`);
    else { S.strikes++; lines.push(`${c.name}：${v}（標準 ${c.thr}）補考仍未通過，列入學籍紀錄`); }
  });
  if (S.stats.aca >= 80) { out.rec.嘉獎 = (out.rec.嘉獎 || 0) + 2; lines.push("學業成績名列前茅，獲頒書卷獎，嘉獎兩次"); }
  if (S.stats.fit >= 80) { out.rec.嘉獎 = (out.rec.嘉獎 || 0) + 1; lines.push("體能測驗成績優異，嘉獎乙次"); }
  if (S.flags.leader) { out.rec.嘉獎 = (out.rec.嘉獎 || 0) + 1; lines.push("擔任學生幹部盡責，嘉獎乙次"); }
  out.report = lines;
  out.r = S.strikes ? `目前累計未通過紀錄：${S.strikes} 次（達 2 次即退學）。` : "全數通過，順利升級。";
}

function exam() {
  const s = S.stats, d = dept();
  const score = Math.round(s.aca * 0.55 + s.men * 0.2 + s.mor * 0.1 + s.fit * 0.08 + s.soc * 0.07 + S.bonus + (S.flags.prep ? 4 : 0) + rnd(-6, 6));
  S.examScore = score;
  S.log.push({ st: "特考", ev: "放榜", c: "總成績 " + score });
  finish(score >= 52 ? "pass" : "failExam");
}

function continueOn() {
  S.result = null;
  if (checkFatal()) return;
  S.idx++;
  if (S.idx >= S.queue.length) { view = "stageEnd"; }
  else view = "event";
  save(); render();
}
function checkFatal() {
  if (S.stats.men <= 0) { finish("breakdown"); return true; }
  if (netDemerit(S.rec) >= EXPEL_AT) { finish("expel"); return true; }
  if (S.strikes >= 2) { finish("academic"); return true; }
  return false;
}
function nextStage() { beginStage(S.stage + 1); view = "event"; save(); render(); }

/* ---------- 結局 ---------- */
function topStat() { return STAT_KEYS.reduce((a, k) => (S.stats[k] > S.stats[a] ? k : a), STAT_KEYS[0]); }
const EPITHET = { fit: "鐵人", aca: "學霸", mor: "模範生", men: "鋼鐵心臟", soc: "人氣王" };

function finish(kind) {
  const d = dept(), f = S.flags, extra = [];
  let E;
  if (kind === "quit") E = { key: "quit", seal: "退訓", head: "退訓申請", big: "你在第六週離開了", sub: "預備教育・自請退訓",
    p: ["區隊長收下申請書，沉默了很久，最後只說了一句：「想清楚就好。」", "你換回便服走出校門，警衛向你點了點頭。這條路不適合每個人，承認這點也需要勇氣。"] };
  else if (kind === "breakdown") E = { key: "breakdown", seal: "休學", head: "休學通知", big: "你需要停下來", sub: STAGES[S.stage] + "・身心狀況亮紅燈",
    p: ["長期的壓力壓垮了你。輔導老師陪你辦了休學手續，建議你先好好休息。", "放下不代表失敗。如果哪天想回來，學校的大門還在。"] };
  else if (kind === "expel") E = { key: "expel", seal: "退學", head: "學生獎懲委員會決議", big: "功過相抵後滿三大過", sub: STAGES[S.stage] + "・依學生獎懲規定退學",
    p: ["獎懲委員會的決議送到寢室時，室友們都低著頭。", `你累積了申誡 ${S.rec.申誡}、小過 ${S.rec.小過}、大過 ${S.rec.大過}，扣除獎勵後仍達三大過。警察的第一課是紀律，你沒有通過這一課。`] };
  else if (kind === "academic") E = { key: "academic", seal: "退學", head: "教務處通知", big: "學業考核未通過", sub: STAGES[S.stage] + "・累計兩次補考未過",
    p: ["成績單上的紅字比任何訓話都安靜。", "你收拾寢室的時候，在抽屜裡翻到預備教育時寫的那封家書。"] };
  else if (kind === "failExam") E = { key: "failExam", seal: "落榜", head: "考選部榜單", big: "榜單上沒有你的名字", sub: `警察特考三等・${d.cat}・總成績 ${S.examScore}`,
    p: ["你把准考證號碼輸入了三次，結果都一樣。", "警大公費生畢業後必須通過特考才能任官；你決定明年再戰。一起畢業的同學陸續報到，你在群組裡看他們分享第一天上班的照片。", "這一年會很難熬，但你已經撐過四年了。"] };
  else {
    const t = topStat();
    const top = S.examScore >= 80;
    const vale = S.stats.aca >= 85 && S.stats.mor >= 75;
    let unit = d.unit, role = d.role;
    if (f.front && d.id === "adm") unit = "市政府警察局保安警察大隊";
    if (f.staff && d.id === "adm") unit = "內政部警政署";
    E = { key: top ? "top" : "pass", seal: "派令", head: "內政部警政署派令",
      big: (top ? "特考榜首・" : "") + EPITHET[t] + role,
      sub: `警察特考三等・${d.cat}・總成績 ${S.examScore}`,
      p: [`茲派 ${S.name} 為 ${unit}${role}，警正四階。`] };
    if (top) extra.push("你的名字掛在全國榜單的第一行。報到那天，局長親自跟你握了手。");
    if (vale) extra.push("你同時拿下畢業總成績前段的榮譽，在畢業典禮上代表全體畢業生致詞。");
    const flav = {
      fit: "第一次出勤就追上了逃逸的嫌犯，學長說你跑起來像預備教育時那場 3000 公尺。",
      aca: "你寫的第一份簽呈被長官原封不動地往上呈，從此你的桌上總是堆滿最難的案子。",
      mor: "報到第一週，就有業者想「意思意思」。你把信封推回去，同事們看你的眼神多了一分敬意。",
      men: "第一個大夜班遇到重大事故，你是現場最冷靜的那個人。",
      soc: "不到一個月，轄區的里長、店家和巡守隊都叫得出你的名字。",
    };
    extra.push(flav[t]);
    if (f.partner) extra.push("那個說要等你畢業的人，在授階典禮的台下哭得比你還兇。");
    if (f.buddy) extra.push("室友阿凱分發到隔壁分局，你們約好每個月吃一次宵夜。");
    if (S.club) extra.push(`${CLUB_NAME[S.club]}的學弟妹送來一張大合照，背面寫著「學長姐加油」。`);
    if (f.cheated) extra.push("只是偶爾，你還是會想起一年級那支原子筆。");
    if (f.injury) extra.push("一年級留下的手腕舊傷在下雨天會痛，提醒你走過的每一步。");
    E.p = E.p.concat(extra);
  }
  S.ending = E;
  const seen = fetchStore(ENDINGS_KEY) || [];
  if (!seen.includes(E.key)) { seen.push(E.key); store(ENDINGS_KEY, seen); }
  view = "ending";
  save(); render();
}

/* ---------- 畫面 ---------- */
const $app = document.getElementById("app");
const $tl = document.getElementById("timeline");
const $restart = document.getElementById("restartBtn");

function render() {
  const inGame = S && view !== "title" && view !== "create";
  $tl.hidden = !inGame;
  $restart.hidden = !(S && view !== "title");
  if (inGame) renderTimeline();
  if (view === "title") $app.innerHTML = titleView();
  else if (view === "create") $app.innerHTML = createView();
  else $app.innerHTML = `<div class="layout">${idCard()}<section>${mainView()}</section></div>`;
  bind();
  window.scrollTo(0, 0);
}

function renderTimeline() {
  const cur = S.stage;
  $tl.innerHTML = STAGES.map((n, i) => {
    const cls = i < cur || (view === "stageEnd" && i === cur) ? "done" : i === cur ? "now" : "";
    return `<li class="${cls}"><span class="n">0${i + 1}</span>${n}</li>`;
  }).join("");
}

function titleView() {
  const saved = fetchStore(SAVE_KEY);
  const seen = fetchStore(ENDINGS_KEY) || [];

      <div class="row">

      <li><b>特考</b><small>警察特考三等，決定你的派令</small></li>
    </ol>
  </div>`;
}

function statLine(k, v) {
  return `<div class="stat"><span>${STAT_NAME[k]}</span><div class="bar"><i class="${v < 25 ? "low" : ""}" style="width:${v}%"></i></div><span class="v">${v}</span></div>`;
}

function createView() {
  const d = draft, st = draftStats(d);
  const bonusText = (b) => Object.entries(b).map(([k, v]) => `${STAT_NAME[k]} ${v > 0 ? "+" : ""}${v}`).join("・");
  return `<div class="layout">
    <aside class="preview">
      <p class="section-label">預覽數值</p>
      <div class="stats">${STAT_KEYS.map((k) => statLine(k, st[k])).join("")}</div>
      <div class="row"><button class="btn line" data-act="reroll" type="button">重新擲骰</button></div>
      <p class="meter-note">基礎 45，加上學系與出身加成，再加 ±5 的隨機值。</p>
    </aside>
    <section class="doc">
      <div class="doc-meta"><span>入學報到表</span><span>115 學年度・大學部四年制</span></div>
      <h2>新生資料</h2>
      <div class="form">
        <div>
          <p class="field-label"><label for="nameIn">姓名</label></p>
          <div class="row"><input id="nameIn" class="text-in" maxlength="8" value="${esc(d.name)}"><button class="ghost" data-act="randname" type="button">隨機</button></div>
        </div>
        <div>
          <p class="field-label">性別</p>
          <div class="seg">${["男", "女"].map((g) => `<button type="button" data-gender="${g}" aria-pressed="${d.gender === g}">${g}</button>`).join("")}</div>
        </div>
        <div>
          <p class="field-label">學系<small>決定特考類科與分發單位</small></p>
          <div class="pick">${DEPTS.map((x) => `<button type="button" class="opt" data-dept="${x.id}" aria-pressed="${d.dept === x.id}"><b>${x.name}</b><span>${bonusText(x.b)}</span></button>`).join("")}</div>
        </div>
        <div>
          <p class="field-label">出身</p>
          <div class="pick">${BACKGROUNDS.map((x) => `<button type="button" class="opt" data-bg="${x.id}" aria-pressed="${d.bg === x.id}"><b>${x.name}</b><span>${x.d}<br>${bonusText(x.b)}</span></button>`).join("")}</div>
        </div>
        <div class="row"><button class="btn" data-act="start" type="button">完成報到</button><button class="btn line" data-act="back" type="button">返回</button></div>
      </div>
    </section>
  </div>`;
}

function idCard() {
  const d = dept(), net = netDemerit(S.rec), left = EXPEL_AT - net;
  const flags = Object.keys(S.flags).filter((f) => FLAG_NAME[f]).map((f) => `<span class="flag">${FLAG_NAME[f]}</span>`);
  if (S.club) flags.unshift(`<span class="flag">${CLUB_NAME[S.club]}</span>`);
  return `<aside class="idcard">
    <div class="id-band"><span>學生證</span><span>CPU</span></div>
    <div class="id-main">
      <div class="id-head">
        <div class="avatar" aria-hidden="true">${esc(S.name.slice(-1))}</div>
        <div>
          <div class="id-name">${esc(S.name)}</div>
          <div class="id-meta">${d.name}・${S.gender}<br>學號 <span class="mono">${S.sid}</span></div>
        </div>
      </div>
      <div><p class="section-label">能力</p><div class="stats">${STAT_KEYS.map((k) => statLine(k, S.stats[k])).join("")}</div></div>
      <div>
        <p class="section-label">獎懲紀錄</p>
        <div class="recs">${REC_GOOD.map((k) => `<div class="rec ok"><span>${k}</span><b>${S.rec[k]}</b></div>`).join("")}${REC_BAD.map((k) => `<div class="rec bad"><span>${k}</span><b>${S.rec[k]}</b></div>`).join("")}</div>
        <p class="meter-note ${left <= 9 ? "warn" : ""}">${net > 0 ? `功過相抵後仍有 ${net} 點，距離三大過還差 ${left} 點` : "功過相抵後沒有懲處"}${S.strikes ? `・補考未過 ${S.strikes} 次` : ""}</p>
      </div>
      ${flags.length ? `<div><p class="section-label">狀態</p><div class="flags">${flags.join("")}</div></div>` : ""}
    </div>
  </aside>`;
}

function mainView() {
  if (view === "event") return eventView();
  if (view === "result") return resultView();
  if (view === "stageEnd") return stageEndView();
  if (view === "ending") return endingView();
  return "";
}

const MARKS = ["甲", "乙", "丙", "丁", "戊"];
function docMeta(ev) {
  return `<div class="doc-meta"><span>${esc(ev.when)}</span><span>${esc(ev.where || "")}</span></div>`;
}
function eventView() {
  const ev = currentEvent();
  const n = S.idx + 1, total = S.queue.length;
  return `<article class="doc">
    ${docMeta(ev)}
    <h2>${esc(ev.title)}</h2>
    <p class="body">${esc(ev.text)}</p>
    <div class="choices">${ev.ch.map((c, i) => {
      let tag = "";
      if (c.chk) tag = `判定・${STAT_NAME[c.chk.s]} ${chance(S.stats[c.chk.s], c.chk.dc)}%`;
      if (c.danger) tag = c.danger + (c.chk ? `・${STAT_NAME[c.chk.s]} ${chance(S.stats[c.chk.s], c.chk.dc)}%` : "");
      return `<button type="button" class="choice ${c.danger ? "danger" : ""}" data-choice="${i}"><span class="mk">${MARKS[i]}</span><span>${esc(c.t)}</span>${tag ? `<span class="tag">${tag}</span>` : ""}</button>`;
    }).join("")}</div>
    ${logView(`${STAGES[S.stage]}・第 ${n} / ${total} 件`)}
  </article>`;
}

function resultView() {
  const ev = currentEvent(), o = S.result;
  const chips = [];
  for (const k of STAT_KEYS) if (o.e[k]) chips.push(`<span class="chip ${o.e[k] > 0 ? "up" : "down"}">${STAT_NAME[k]} ${o.e[k] > 0 ? "+" : ""}${o.e[k]}</span>`);
  for (const k of REC_GOOD) if (o.rec[k]) chips.push(`<span class="chip rec-ok">${k}${cnNum(o.rec[k])}次</span>`);
  for (const k of REC_BAD) if (o.rec[k]) chips.push(`<span class="chip rec-bad">${k}${cnNum(o.rec[k])}次</span>`);
  const stamp = o.roll ? `<span class="stamp ${o.roll.ok ? "ok" : ""}">${o.roll.ok ? "判定成功" : "判定失敗"}</span>` : "";
  return `<article class="doc">
    ${docMeta(ev)}
    <h2>${esc(ev.title)}</h2>
    <div class="result-head"><span class="you-chose">你選擇：${esc(o.label)}</span>${stamp}</div>
    ${o.report ? `<div class="report">${o.report.map((l) => `<span>${esc(l)}</span>`).join("")}</div>` : ""}
    <p class="body">${esc(o.r)}</p>
    ${chips.length ? `<div class="deltas">${chips.join("")}</div>` : ""}
    <button class="btn" data-act="next" type="button">繼續</button>
  </article>`;
}

function stageEndView() {
  const n = S.stage, prev = S.stageStart;
  const rows = STAT_KEYS.map((k) => {
    const d = S.stats[k] - prev[k];
    return `<div><small>${STAT_NAME[k]}</small><b>${S.stats[k]}</b> <span class="chip ${d > 0 ? "up" : d < 0 ? "down" : ""}">${d > 0 ? "+" : ""}${d}</span></div>`;
  }).join("");
  const label = n === 0 ? "預備教育結訓" : n === 4 ? "四年級畢業" : STAGES[n] + "結束";
  return `<article class="doc">
    <div class="doc-meta"><span>階段結算</span><span>${STAGES[n]}</span></div>
    <h2>${label}</h2>
    <p class="body">${n === 4 ? "四年的校園生活畫下句點。接下來，只剩最後一關。" : "這個階段告一段落。以下是你這段時間的變化。"}</p>
    <div class="summary">${rows}</div>
    <button class="btn" data-act="stage" type="button">進入${STAGES[n + 1]}</button>
  </article>`;
}

function endingView() {
  const E = S.ending, sealChars = (E.seal + "結局").slice(0, 4).split("");
  const summary = STAT_KEYS.map((k) => `<div><small>${STAT_NAME[k]}</small><b>${S.stats[k]}</b></div>`).join("")
    + `<div><small>嘉獎／功</small><b>${S.rec.嘉獎}／${S.rec.小功 + S.rec.大功}</b></div>`
    + `<div><small>申誡／過</small><b>${S.rec.申誡}／${S.rec.小過 + S.rec.大過}</b></div>`;
  return `<article class="doc order">
    <div class="doc-meta"><span>${esc(E.head)}</span><span>學號 ${S.sid}</span></div>
    <div class="seal" aria-hidden="true">${sealChars.map((c) => `<span>${c}</span>`).join("")}</div>
    <p class="big">${esc(E.big)}</p>
    <p class="sub">${esc(E.sub)}</p>
    <div class="order-text">${E.p.map((x) => `<p>${esc(x)}</p>`).join("")}</div>
    <div class="summary">${summary}</div>
    <div class="row"><button class="btn" data-act="again" type="button">再玩一次</button><button class="btn line" data-act="home" type="button">回到封面</button></div>
    ${logView("這一路的選擇", true)}
  </article>`;
}

function logView(label, open) {
  if (!S.log.length) return `<p class="meter-note">${label}</p>`;
  return `<details class="log" ${open ? "open" : ""}><summary>${label}・回顧 ${S.log.length} 個選擇</summary><ol>${S.log.map((l) => `<li>${esc(l.st)}・${esc(l.ev)}：<span>${esc(l.c)}</span></li>`).join("")}</ol></details>`;
}

/* ---------- 事件綁定 ---------- */
function bind() {
  $app.querySelectorAll("[data-choice]").forEach((b) => b.addEventListener("click", () => choose(+b.dataset.choice)));
  $app.querySelectorAll("[data-gender]").forEach((b) => b.addEventListener("click", () => { draft.gender = b.dataset.gender; render(); }));
  $app.querySelectorAll("[data-dept]").forEach((b) => b.addEventListener("click", () => { draft.dept = b.dataset.dept; keepName(); render(); }));
  $app.querySelectorAll("[data-bg]").forEach((b) => b.addEventListener("click", () => { draft.bg = b.dataset.bg; keepName(); render(); }));
  const nameIn = document.getElementById("nameIn");
  if (nameIn) nameIn.addEventListener("input", () => (draft.name = nameIn.value));
  $app.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => act(b.dataset.act)));
}
function keepName() { const n = document.getElementById("nameIn"); if (n) draft.name = n.value; }

function act(a) {
  if (a === "new") { draft = newDraft(); view = "create"; render(); }
  else if (a === "continue") { S = fetchStore(SAVE_KEY); view = S.result ? "result" : S.idx >= S.queue.length ? "stageEnd" : "event"; render(); }
  else if (a === "reroll") { keepName(); draft.roll = rollDice(); render(); }
  else if (a === "randname") { draft.name = NAMES[rnd(0, NAMES.length - 1)]; render(); }
  else if (a === "start") { keepName(); startGame(); }
  else if (a === "back" || a === "home") { if (S && S.ending) S = null; view = "title"; render(); }
  else if (a === "next") continueOn();
  else if (a === "stage") nextStage();
  else if (a === "again") { S = null; draft = newDraft(); view = "create"; render(); }
}

$restart.addEventListener("click", () => {
  if ($restart.dataset.confirm === "1") {
    clearStore(SAVE_KEY); S = null; draft = null; view = "title";
    $restart.dataset.confirm = ""; $restart.textContent = "重新開始"; render();
  } else {
    $restart.dataset.confirm = "1"; $restart.textContent = "確定放棄目前進度？";
    setTimeout(() => { $restart.dataset.confirm = ""; $restart.textContent = "重新開始"; }, 3000);
  }
});

/* ---------- 啟動 ---------- */
function start(data) {
  if (data && data.view) { S = data.S; view = data.view; draft = data.draft; }
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S, view, draft }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
